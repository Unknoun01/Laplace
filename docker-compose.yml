name: laplace

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: laplace-clickhouse
    environment:
      CLICKHOUSE_DB: laplace
      CLICKHOUSE_USER: laplace
      CLICKHOUSE_PASSWORD: laplace
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    # Sólo desde esta máquina: la base la usa el backend por la red de compose, y
    # publicarla en todas las interfaces con la contraseña de ejemplo era dejarla abierta
    # a la red local. Los puertos siguen ahí para las pruebas y para mirar a mano.
    ports:
      - "127.0.0.1:8123:8123"   # HTTP
      - "127.0.0.1:9000:9000"   # protocolo nativo
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      # 127.0.0.1 y no `localhost`: dentro del contenedor resuelve primero a ::1 y
      # ClickHouse sólo escucha en IPv4, así que el healthcheck no pasaría nunca.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    container_name: laplace-postgres
    environment:
      POSTGRES_DB: laplace
      POSTGRES_USER: laplace
      POSTGRES_PASSWORD: laplace
    ports:
      # 5433 en el host: 5432 suele estar ocupado por un Postgres nativo, y
      # colisionar con la base de datos del desarrollador es la peor primera impresion.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laplace -d laplace"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: laplace-backend
    environment:
      LAPLACE_CLICKHOUSE_HOST: clickhouse
      LAPLACE_CLICKHOUSE_PORT: 8123
      LAPLACE_CLICKHOUSE_USER: laplace
      LAPLACE_CLICKHOUSE_PASSWORD: laplace
      LAPLACE_CLICKHOUSE_DATABASE: laplace
      LAPLACE_POSTGRES_DSN: postgresql://laplace:laplace@postgres:5432/laplace
      LAPLACE_CORS_ORIGINS: http://localhost:3000
      # De qué proxies se cree X-Forwarded-For: de `web`, por donde entra la interfaz.
      # Es seguro sólo porque delante de Next está `entrada` (Caddy), que REESCRIBE la
      # cabecera con la IP real, y porque `web` no publica su puerto. Next por sí solo
      # reenvía la cabecera del navegador tal cual: sin Caddy, creer a `web` era creer al
      # cliente (comprobado, D-128). Si quitas `entrada`, deja esto vacío.
      LAPLACE_TRUSTED_PROXIES: "${LAPLACE_TRUSTED_PROXIES:-web}"
      # Tope de una petición, en MiB. Un lote OTLP normal son unos pocos megas.
      LAPLACE_MAX_BODY_MB: "${LAPLACE_MAX_BODY_MB:-32}"
      # Autenticacion. En la nube se exige clave por defecto; esto solo existe para
      # poder quitarla a sabiendas en una maquina de pruebas, y el log lo grita cuando
      # esta desactivada (D-097). Las claves se crean con:
      #   docker compose exec backend python -m laplace_backend.keys create --project X
      LAPLACE_AUTH_REQUIRED: "${LAPLACE_AUTH_REQUIRED:-auto}"
      # Alertas a Slack. Apagadas hasta que haya un webhook: nada que mande mensajes
      # fuera se enciende solo. Son las mismas variables que usa `laplace ui` (D-075).
      LAPLACE_ALERTS_ENABLED: "${LAPLACE_ALERTS_ENABLED:-false}"
      LAPLACE_ALERTS_SLACK_WEBHOOK: "${LAPLACE_ALERTS_SLACK_WEBHOOK:-}"
      LAPLACE_ALERTS_BASE_URL: "${LAPLACE_ALERTS_BASE_URL:-http://localhost:3000}"
      LAPLACE_ALERTS_MIN_USD: "${LAPLACE_ALERTS_MIN_USD:-1.0}"
      LAPLACE_ALERTS_QUIET_HOURS: "${LAPLACE_ALERTS_QUIET_HOURS:-24}"
      LAPLACE_ALERTS_CONFIG_PATH: "${LAPLACE_ALERTS_CONFIG_PATH:-}"
      # LLM-as-judge de la pestana de Evaluaciones. Apagado hasta que haya una clave:
      # el veredicto de maquina es opcional y cuesta dinero (D-088).
      LAPLACE_EVALS_JUDGE_ENABLED: "${LAPLACE_EVALS_JUDGE_ENABLED:-false}"
      LAPLACE_EVALS_JUDGE_SYSTEM: "${LAPLACE_EVALS_JUDGE_SYSTEM:-anthropic}"
      LAPLACE_EVALS_JUDGE_MODEL: "${LAPLACE_EVALS_JUDGE_MODEL:-}"
      LAPLACE_EVALS_JUDGE_API_KEY: "${LAPLACE_EVALS_JUDGE_API_KEY:-}"
    ports:
      - "8000:8000"
      # Alias en el puerto OTLP/HTTP estándar: cualquier exportador OpenTelemetry
      # puede apuntar aquí sin saber nada de Laplace.
      - "4318:8000"
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        LAPLACE_API_URL: http://backend:8000
    container_name: laplace-web
    environment:
      # El navegador habla siempre con el mismo origen y Next hace de puente hacia el
      # backend (ver `rewrites` en next.config.mjs). Así la interfaz no lleva ninguna
      # URL incrustada en el build y no hay CORS que abrir (D-069).
      LAPLACE_API_URL: http://backend:8000
    # Sin puerto publicado a propósito: a Next sólo se llega por `entrada`. Si Next fuera
    # alcanzable directamente, cualquiera podría mandarle un X-Forwarded-For inventado
    # que el backend, que se fía de `web`, se creería.
    expose:
      - "3000"
    depends_on:
      - backend

  entrada:
    # La puerta de la interfaz: reescribe X-Forwarded-For con la IP real para que el
    # freno de intentos y la auditoría vean a cada usuario (ver deploy/Caddyfile).
    image: caddy:2-alpine
    container_name: laplace-entrada
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web

volumes:
  clickhouse-data:
  postgres-data:
