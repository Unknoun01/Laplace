[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laplace-trace"
dynamic = ["version"]
description = "Observabilidad y optimización de agentes de IA: trazas, coste por paso y detección de derroche."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Laplace" }]
keywords = [
    "llm", "agents", "observability", "opentelemetry", "tracing", "cost", "genai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "pydantic>=2.0",
]

[project.scripts]
laplace = "laplace.cli:main"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
# Todo lo que hace falta para `laplace ui`: el backend con su almacén SQLite y el
# servidor. No entra por defecto porque un SDK de trazas no puede arrastrar FastAPI a
# la imagen de producción de nadie (D-068).
ui = ["laplace-backend>=0.1.0", "uvicorn[standard]>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/Unknoun01/Laplace"
Documentation = "https://github.com/Unknoun01/Laplace/tree/master/docs"
Source = "https://github.com/Unknoun01/Laplace"

[tool.hatch.version]
path = "laplace/version.py"

[tool.hatch.build.targets.wheel]
packages = ["laplace"]
# La interfaz exportada. La deja ahí `python scripts/build_ui.py` antes de publicar;
# en el repositorio no está, y `laplace ui` la busca en `apps/web/out` (D-069).
artifacts = ["laplace/ui/**"]

[tool.hatch.build.targets.sdist]
include = ["laplace", "README.md", "pyproject.toml"]
artifacts = ["laplace/ui/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A"]
