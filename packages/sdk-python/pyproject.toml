[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laplace-trace"
dynamic = ["version"]
description = "Observabilidad y optimización de agentes de IA: trazas, coste por paso y detección de derroche."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Laplace" }]
keywords = [
    "llm", "agents", "observability", "opentelemetry", "tracing", "cost", "genai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/laplace-dev/laplace"
Documentation = "https://github.com/laplace-dev/laplace/tree/main/docs"
Source = "https://github.com/laplace-dev/laplace"

[tool.hatch.version]
path = "laplace/version.py"

[tool.hatch.build.targets.wheel]
packages = ["laplace"]

[tool.hatch.build.targets.sdist]
include = ["laplace", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A"]
