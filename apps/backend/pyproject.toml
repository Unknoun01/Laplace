[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laplace-backend"
version = "0.1.0"
description = "Ingesta OTLP y API de lectura de Laplace."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.2",
    "opentelemetry-proto>=1.24",
    "protobuf>=4.25",
    # Contrato de traza compartido (D-001). En desarrollo se instala con
    #   pip install -e ../../packages/sdk-python
    "laplace-trace>=0.1.0",
]

[project.optional-dependencies]
# Los almacenes de la nube. El modo local corre sobre SQLite, que viene con Python, y
# no debe pagar por drivers que no usa (D-068). El despliegue instala `[cloud]`.
cloud = ["clickhouse-connect>=0.7", "psycopg[binary]>=3.1"]
# `httpx2` lo pide el TestClient de Starlette para montar la app en memoria, y los dos
# SDK de proveedor están aquí porque `test_proveedores_reales.py` los usa DE VERDAD:
# cliente real, parseo real, lector de SSE real, con el transporte HTTP falseado. Si no
# estuvieran, ese fichero se saltaría solo y volveríamos a probar las integraciones
# contra dobles escritos por nosotros, que es como no probarlas.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "httpx2>=0.28",
    "ruff>=0.5",
    "openai>=1.0",
    "anthropic>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["laplace_backend"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
